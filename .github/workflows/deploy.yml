name: Deploy

# Modèle "pull" : GitHub Actions se contente de tester, construire l'image et
# la pousser sur GHCR. Il ne se connecte JAMAIS au VPS.
# Le VPS détecte la nouvelle image via un timer systemd (sigma-front-deploy.timer)
# et applique lui-même (scripts/deploy-watch.sh -> scripts/deploy.sh).
# => aucun port entrant exposé sur le serveur qui héberge les données.

on:
  push:
    branches: [main]

concurrency:
  group: build-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ----------------------------------------------------------------
  # 1. Qualité : lint + types + build (garde-fou avant l'image)
  # ----------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint          # informatif : ne bloque pas le déploiement
        continue-on-error: true
      - run: npm run typecheck     # bloquant : vraies erreurs de types
      - run: npm run build         # bloquant : la compilation Next.js doit passer
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

  # ----------------------------------------------------------------
  # 2. Build de l'image Docker + push sur GHCR (privé)
  # ----------------------------------------------------------------
  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/oceance-dev/sigma-web
          tags: |
            type=raw,value=latest
            type=sha,format=long
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_API_HOST=${{ secrets.NEXT_PUBLIC_API_HOST }}
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Pas de job "deploy" : le VPS tire l'image lui-même (voir docs/DEPLOY.md).
